name: dsh-compressor

on:
  push:
    paths:
      - "plugins/dsh-compressor/**"
      - ".github/workflows/dsh-compressor.yml"
  pull_request:
    paths:
      - "plugins/dsh-compressor/**"
      - ".github/workflows/dsh-compressor.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-compressor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/dsh-compressor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
